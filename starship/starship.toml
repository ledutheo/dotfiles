# Prompt lisible — palette proche de Grok TUI (Tokyo Night).
# Format court: dossier + git + durée des commandes lentes.

"$schema" = "https://starship.rs/config-schema.json"

palette = "tokyo"
add_newline = true
command_timeout = 1000

format = """
$directory$git_branch$git_status$cmd_duration
$character"""

[palettes.tokyo]
fg = "#c0caf5"
blue = "#7aa2f7"
cyan = "#7dcfff"
green = "#9ece6a"
yellow = "#e0af68"
red = "#f7768e"
purple = "#bb9af7"
muted = "#565f89"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " ro"
repo_root_style = "bold cyan"

[git_branch]
symbol = ""
format = "[$branch]($style) "
style = "purple"

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "✗"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
stashed = "≡"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "muted"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
